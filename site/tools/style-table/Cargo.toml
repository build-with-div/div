# Probes Div's style parser for the website's styling reference
# (site/tools/style-table/generate.py). It depends only on div-style, so
# it builds without Skia. Its own workspace, like site/showcase.
[workspace]

[package]
name = "div-style-table"
description = "Lists every Div style property and the literals its parser accepts"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
div-style = { path = "../../../crates/div-style" }
