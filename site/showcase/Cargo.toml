# Renders the website's app screenshots with Div. A separate Cargo
# workspace, like components/, so the site's npm build and CI never touch
# Rust or Skia. It repeats the patches of components/Cargo.toml.
[workspace]
resolver = "2"

[package]
name = "div-site-showcase"
description = "Renders the Div website's screenshots with Div"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[[bin]]
name = "div-site-showcase"
path = "src/main.rs"

[dependencies]
# The features compile the app-service snippets (src/snippets); the
# renderer itself uses only HeadlessApp.
divui = { version = "=0.2.0", path = "../../crates/divui", features = ["desktop", "menu", "dialog", "http", "testing"] }
div-components = { path = "../../crates/div-components" }
serde_json = "=1.0.149"

[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { path = "../../vendor/skrifa-v0_40" }
read-fonts = { path = "../../vendor/read-fonts-v0_37" }
font-types = { path = "../../vendor/font-types-v0_11" }
bytemuck = { path = "../../vendor/bytemuck-v1" }
bytemuck_derive = { path = "../../vendor/bytemuck_derive-v1" }
