[package]
name = "div-canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "CanvasRenderingContext2D for Div, ported from Blink's canvas2d at Chromium 147"

[dependencies]
div-style = { version = "=0.2.0", path = "../div-style" }
# `initialize_skia`, and text in a later step.
div-text = { version = "=0.2.0", path = "../div-text" }
skia-safe = "0.94"
# Exact double parsing: trace arguments and oracle values must round-trip.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
png = "0.17"
