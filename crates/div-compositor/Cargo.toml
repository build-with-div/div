[package]
name = "div-compositor"
version.workspace = true
edition.workspace = true
description = "Immutable scene snapshots and rendering backends for Div"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
ganesh-gl = ["dep:gl", "dep:glutin", "skia-safe/gl"]

[dependencies]
div-geometry = { version = "=0.2.0", path = "../div-geometry" }
div-layout = { version = "=0.2.0", path = "../div-layout" }
div-paint = { version = "=0.2.0", path = "../div-paint" }
skia-safe = "0.94"
gl = { version = "=0.14.0", optional = true }
glutin = { version = "=0.32.3", default-features = false, features = ["egl"], optional = true }

[dev-dependencies]
div-dom = { version = "=0.2.0", path = "../div-dom" }
