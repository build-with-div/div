[package]
name = "div-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "SVG geometry for Div: path data, basic shapes, lengths, transforms and viewports, as Chromium 147 computes them"

[dependencies]
div-style = { version = "=0.2.0", path = "../div-style" }
div-text = { version = "=0.2.0", path = "../div-text" }
skia-safe = "0.94"

[dev-dependencies]
png = "0.17"
serde_json = { workspace = true, features = ["float_roundtrip"] }
